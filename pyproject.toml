[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshbridge"
version = "0.1.2"
description = "Discord to MeshCore bridge"
requires-python = ">=3.10"
dependencies = [
  "discord.py>=2.4",
  "aiohttp>=3.9",
  "hjson>=3.1",
  "psutil>=5.9",
  "meshcore>=2.3.7",
]

[tool.setuptools.packages.find]
include = ["meshbridge*"]
